<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snail Sign</title>

<!-- ============================================================
     The signing app used to live here, at /app.html, while the
     homepage lived at /index.html. They are now a single page at /,
     so this file only exists to catch old bookmarks and the links
     inside signing emails that were sent before the merge. It sends
     everyone to the homepage, where the app now is.

     Do not delete this file. Links to it are already out in the world.
     ============================================================ -->
<meta http-equiv="refresh" content="0; url=/">
<link rel="canonical" href="https://snailsign.com/">
<meta name="robots" content="noindex">

<style>
  html { background: #FAF7F1; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #14312D; text-align: center; padding: 24px;
  }
  a { color: #0E7C6B; }
</style>
</head>
<body>
  <p>Snail Sign has moved to <a href="/">snailsign.com</a>. Taking you there now.</p>
  <script>location.replace('/');</script>
</body>
